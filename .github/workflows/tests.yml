name: Isolated audio tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 shellcheck pipewire-bin pipewire-pulse libpipewire-0.3-modules wireplumber dbus
      - name: Unit tests and shell analysis
        run: |
          python3 -m unittest discover -s tests -v
          shellcheck *.sh legacy/*.sh
          for script in *.sh legacy/*.sh; do bash -n "$script"; done
          git diff --check
      - name: Private PipeWire and WirePlumber integration
        env:
          SPLIT_TEST_WIREPLUMBER: '1'
        run: |
          pipewire --version
          wireplumber --version
          python3 tests/native-smoke.py
